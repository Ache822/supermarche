name: supermarche-dev

services:
  mongodb:
    image: mongo:6-jammy
    container_name: supermarche_mongodb_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - supermarche_network

  redis:
    image: redis:7-alpine
    container_name: supermarche_redis_dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - supermarche_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: supermarche_backend_dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/supermarche}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-super_secure_development_jwt_secret_key_at_least_32_chars_long}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5174,http://localhost:5173}
      - SMTP_HOST=${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-Supermarche Support <no-reply@supermarche.com>}
    depends_on:
      - redis
      - mongodb
    networks:
      - supermarche_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: supermarche_frontend_dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3001/api/v1}
      - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost:3001}
    depends_on:
      - backend
    networks:
      - supermarche_network

volumes:
  redis_data_dev:
  mongo_data_dev:

networks:
  supermarche_network:
    driver: bridge
