name: supermarche-prod

services:
  redis:
    image: redis:7-alpine
    container_name: supermarche_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    networks:
      - supermarche_prod_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: supermarche_backend_prod
    restart: always
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      - redis
    networks:
      - supermarche_prod_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL}
    container_name: supermarche_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - supermarche_prod_network

volumes:
  redis_data_prod:

networks:
  supermarche_prod_network:
    driver: bridge
